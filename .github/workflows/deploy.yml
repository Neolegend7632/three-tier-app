name: Build, Push & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1 ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1 ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1

      - name: Deploy to Linux VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:v1
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend:v1
            cd ~/three-tier-app
            docker-compose down
            docker-compose up -d
            echo "✅ Deployment complete!"