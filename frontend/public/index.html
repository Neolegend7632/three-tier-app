<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 36px;
      width: 100%;
      max-width: 600px;
      height: fit-content;
    }
    h1 { font-size: 1.8rem; color: #2d3748; margin-bottom: 6px; }
    .subtitle { color: #718096; margin-bottom: 28px; font-size: 0.95rem; }
    .input-row { display: flex; gap: 10px; margin-bottom: 28px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4299e1; }
    button.add-btn {
      background: #4299e1;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.add-btn:hover { background: #3182ce; }
    .task-list { list-style: none; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
    }
    .task-item.done { opacity: 0.5; }
    .task-item.done .task-text { text-decoration: line-through; color: #a0aec0; }
    .task-text { flex: 1; font-size: 1rem; color: #2d3748; }
    .done-btn {
      background: #48bb78; color: white; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .delete-btn {
      background: #fc8181; color: white; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .empty { text-align: center; color: #a0aec0; padding: 30px 0; }
    .status { font-size: 0.8rem; color: #a0aec0; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Student Task Manager</h1>
    <p class="subtitle">Keep track of your assignments and tasks</p>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Enter a new task..." />
      <button class="add-btn" onclick="addTask()">Add Task</button>
    </div>
    <ul class="task-list" id="taskList">
      <li class="empty">No tasks yet. Add one above!</li>
    </ul>
    <p class="status" id="statusMsg"></p>
  </div>

  <script>
    const API = '/api/tasks';
// This Function loads all existing tasks from the backend
    async function loadTasks() {
      try {
        const res = await fetch(API);
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (e) {
        document.getElementById('statusMsg').textContent = '⚠️ Could not connect to backend.';
      }
    }

    function renderTasks(tasks) {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty">No tasks yet. Add one above!</li>';
        return;
      }
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.innerHTML = `
          <span class="task-text">${task.title}</span>
          <button class="done-btn" onclick="toggleTask(${task.id}, ${task.done})">${task.done ? 'Undo' : 'Done'}</button>
          <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
        `;
        list.appendChild(li);
      });
    }
// This Function allows for new tasks to be added to the backend
    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      input.value = '';
      loadTasks();
    }
// This Function allows for changing tasks
    async function toggleTask(id, currentDone) {
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done: !currentDone })
      });
      loadTasks();
    }
// This Function is for deleting existing tasks
    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    document.getElementById('taskInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks();
  </script>
</body>
</html>
